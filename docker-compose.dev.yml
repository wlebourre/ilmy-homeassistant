# Dev-only Home Assistant container for smoke-testing the Ilmy integration.
#
#   docker compose -f docker-compose.dev.yml up -d
#   open http://localhost:8123
#
# The ilmy services must be reachable from inside the container:
#   - same docker host: use http://host.docker.internal:<port>
#   - another machine:  use its LAN IP or the public domains
services:
  homeassistant:
    # Pinned to a known stable release (2026.7.4, latest stable as of
    # 2026-07) instead of the floating `:stable` tag — bump deliberately.
    image: ghcr.io/home-assistant/home-assistant:2026.7.4@sha256:5a531753cea96444200158fc2b0ac7ccd739291ec50414877b396de6e0bb29b3
    container_name: ilmy_ha_dev
    ports:
      # Bind to localhost only: a dev instance with onboarding tokens must
      # not be reachable from the LAN.
      - "127.0.0.1:8123:8123"
    environment:
      TZ: Europe/Paris
    volumes:
      - ./dev-config:/config
      - ./custom_components:/config/custom_components
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
